# 척척발표(chuckchuck) 패키지 설치·배포 설정 파일입니다.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chuckchuck"
version = "0.1.0"
description = "척척발표 마이크로 모듈 (F-01/F-03/F-04/F-05/F-06)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[tool.setuptools.packages.find]
include = ["chuckchuck*"]

[tool.pytest.ini_options]
markers = [
    "live: 실제 외부 API(Upstage DocParse·LLM)를 호출한다. RUN_LIVE_TESTS=1 일 때만 실행.",
]
