<!doctype html>
<!--
  개념 성좌 — 3D 프로토타입 (독립 페이지)

  데모 경로(index.html)와 완전히 격리돼 있습니다. 라우터·app.js 와 연결되지
  않아서, 이 파일이 깨져도 시연 흐름은 그대로 돕니다. 리포트에 넣을지는
  여기서 눈으로 보고 정합니다.

  왜 3D 인가: 이 그래프는 노드 17 · 엣지 31 인데 그중 18개가 위계를 가로지르는
  relates 다. 2D 로 그리면 교차선이 엉켜서 「무엇이 무엇과 이어지는가」가 안
  읽힌다 — 공간이 장식이 아니라 가독성인 경우다.

  직접 구현하지 않는다: 3d-force-graph(three.js + d3-force)에 {nodes, links} 만
  넘긴다. 부스 네트워크를 믿지 않으므로 CDN 이 아니라 vendor 로 둔다 (§2).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개념 성좌 — 3D 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --navy:#064E3B; --brand:#0E8850; --cyan:#3fd599; --mid:#B45309; --no:#DC2626; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--navy); overflow:hidden;
              font-family:Pretendard,-apple-system,sans-serif; color:#fff; }
  #graph { position:absolute; inset:0; }
  .hud { position:absolute; z-index:5; pointer-events:none; }
  .hud-top { top:22px; left:26px; }
  .hud-top h1 { margin:0; font-size:19px; font-weight:700; letter-spacing:-.02em; }
  .hud-top p { margin:6px 0 0; font-size:13px; color:#9FC9B6; }
  .legend { position:absolute; left:26px; bottom:24px; z-index:5; display:flex; gap:16px; }
  .legend span { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:#BEE3D2; }
  .legend i { width:10px; height:10px; border-radius:50%; }
  /* 고른 개념 — 오른쪽에 조용히 붙는다. 3D 를 가리지 않는다 */
  .panel { position:absolute; top:22px; right:22px; width:300px; z-index:6;
           background:rgba(4,48,39,.92); border:1px solid rgba(255,255,255,.14);
           border-radius:16px; padding:18px; backdrop-filter:blur(8px);
           opacity:0; transform:translateY(-6px); transition:opacity .18s, transform .18s; }
  .panel.on { opacity:1; transform:none; }
  .panel h2 { margin:0 0 4px; font-size:17px; font-weight:700; }
  .panel .meta { font-size:12px; color:#9FC9B6; margin-bottom:10px; }
  .panel p { margin:0; font-size:13px; line-height:1.62; color:#DDF2E8; }
  .scene-nav-info { display:none !important; }
  .hint { position:absolute; right:22px; bottom:24px; z-index:5;
          font-size:12px; color:#7FB3A2; }
</style>
</head>
<body>
<div id="graph"></div>
<div class="hud hud-top">
  <h1>개념 성좌</h1>
  <p>자료가 약속한 개념 구조 · 노드를 누르면 무엇인지 보여줘요</p>
</div>
<div class="legend">
  <span><i style="background:var(--cyan)"></i>핵심 개념</span>
  <span><i style="background:#7FB3A2"></i>뒷받침 개념</span>
  <span><i style="background:rgba(255,255,255,.5)"></i>위계</span>
  <span><i style="background:rgba(63,213,153,.45)"></i>가로지르는 연결</span>
</div>
<p class="hint">끌어서 돌리고, 휠로 확대해요</p>
<div class="panel" id="panel"><h2 id="pTitle"></h2><p class="meta" id="pMeta"></p><p id="pSum"></p></div>

<script src="js/vendor/3d-force-graph.min.js"></script>
<!-- 라벨용 SpriteText 는 three 를 import 한다. three 는 r160 이후 UMD 빌드를
     없애서 전역으로 못 올린다 — import map 으로 로컬 ESM 을 가리킨다.
     esm.sh 같은 CDN 을 쓰지 않는 이유: 부스에서 네트워크 없이 떠야 한다 (§2).
     전역 THREE 를 만들지 않으므로 3d-force-graph 가 품은 three 와도 안 부딪힌다. -->
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.min.js" } }
</script>
<script type="module">
import SpriteText from './js/vendor/three-spritetext.mjs';

/* 크기는 자료가 실은 비중(weight), 색은 핵심 여부(importance) — 둘 다 실측 필드다.
   리포트에 넣을 때는 색을 판정(설명함/안 나옴)으로 바꾼다: 「크고 빨간 노드」가
   곧 «자료의 핵심인데 안 말한 것» 이 되어 한눈에 읽힌다. */
fetch('data/graph-sample.json').then(r => r.json()).then(g => {
  const data = {
    nodes: g.nodes.map(n => ({
      id: n.id, label: n.label, summary: n.summary || '',
      slides: n.slide_nos || [], core: n.importance === 'core',
      val: 2 + (n.weight || 0) * 10,
    })),
    links: g.edges.map(e => ({ source: e.from, target: e.to, kind: e.kind })),
  };
  const panel = document.getElementById('panel');
  const G = ForceGraph3D()(document.getElementById('graph'))
    .graphData(data)
    .backgroundColor('#064E3B')
    .nodeLabel(n => n.label)
    .nodeVal('val')
    .nodeColor(n => n.core ? '#3fd599' : '#7FB3A2')
    .nodeOpacity(.95)
    /* 이름을 상시로 띄운다. hover 툴팁만 두면 초록 구슬 17개가 되는데,
       그건 «화면의 의미를 이해하도록 돕는 그래픽» 이 아니라 장식이다.
       아이패드에는 hover 도 없다 — 누르기 전에는 아무것도 못 읽는다. */
    .nodeThreeObjectExtend(true)
    .nodeThreeObject(n => {
      const t = new SpriteText(n.label);
      t.color = n.core ? '#EAFBF3' : '#BEE3D2';
      t.textHeight = n.core ? 4.5 : 3.4;
      t.fontFace = 'Pretendard, sans-serif';
      t.fontWeight = n.core ? '700' : '500';
      // 구슬 위로 띄워서 겹치지 않게 — 반지름은 val 에 비례한다
      t.position.set(0, Math.cbrt(n.val) * 3.2 + 3, 0);
      return t;
    })
    .linkColor(l => l.kind === 'parent' ? 'rgba(255,255,255,.55)' : 'rgba(63,213,153,.35)')
    .linkWidth(l => l.kind === 'parent' ? 1.2 : 0.4)
    /* relates 는 방향이 뜻을 갖지 않으므로 화살표를 달지 않는다 —
       위계(parent)에만 방향을 준다 */
    .linkDirectionalArrowLength(l => l.kind === 'parent' ? 3 : 0)
    .linkDirectionalArrowRelPos(1)
    .onNodeClick(n => {
      document.getElementById('pTitle').textContent = n.label;
      document.getElementById('pMeta').textContent =
        (n.core ? '핵심 개념' : '뒷받침 개념') +
        (n.slides.length ? ` · ${n.slides.join('·')}번 슬라이드` : '');
      document.getElementById('pSum').textContent = n.summary;
      panel.classList.add('on');
      // 고른 개념으로 카메라가 다가간다 — 누른 결과가 눈에 보여야 한다
      const d = 90, r = 1 + d / Math.hypot(n.x, n.y, n.z || 1);
      G.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 900);
    })
    .onBackgroundClick(() => panel.classList.remove('on'));

  // 천천히 돌면서 시작한다. 부스에서 가만히 둬도 살아 있어 보인다
  let angle = 0;
  const dist = 260;
  G.cameraPosition({ z: dist });
  const spin = setInterval(() => {
    angle += Math.PI / 900;
    G.cameraPosition({ x: dist * Math.sin(angle), z: dist * Math.cos(angle) });
  }, 30);
  // 손을 대면 자동 회전을 멈춘다 — 연출이 조작을 이기면 안 된다
  ['mousedown', 'touchstart', 'wheel'].forEach(ev =>
    document.getElementById('graph').addEventListener(ev, () => clearInterval(spin), { once: true }));
});
</script>
</body>
</html>
