<!-- 녹음 SDK 모듈 사슬(chuckchuck_bridge → /sdk/index.js → recorder·slide_marks·rehearsal → rehearsal-recorder)을
     처음부터 나란히 받는다. 안 그러면 한 단을 받아야 다음 단을 알아서 공개 경로의 왕복(~0.2초)이 세 번 줄을 선다.
     브리지가 ?v= 를 내용 해시로 바꿔 넣어 모듈 안의 import 주소와 같아진다 (demo/static_assets.py) -->
<link rel="modulepreload" href="js/chuckchuck_bridge.js?v=qkxbc8">
<link rel="modulepreload" href="/sdk/index.js?v=s1">
<link rel="modulepreload" href="/sdk/recorder.js?v=s1">
<link rel="modulepreload" href="/sdk/slide_marks.js?v=s1">
<link rel="modulepreload" href="/sdk/rehearsal.js?v=s1">
<link rel="modulepreload" href="/sdk/rehearsal-recorder.js?v=s1">
<script>
  /* 1336×1024 내부 레이아웃은 유지하고, 실제 창에 들어가는 배율만 계산한다. */
  (() => {
    const syncArtboard = () => {
      const desktop = window.matchMedia('(min-width: 900px)').matches;
      const scale = desktop ? Math.min(innerWidth / 1336, innerHeight / 1024) : 1;
      document.documentElement.style.setProperty('--artboard-scale', String(scale));
    };
    syncArtboard();
    window.addEventListener('resize', syncArtboard, { passive: true });
  })();
</script>
</head>
<body>

<!-- 앱 셸. 좌측 내비가 없으면 "제품"이 아니라 "페이지"로 보인다.
     좁은 화면(<900px)에서는 통째로 숨기고 기존 탑바 흐름을 그대로 쓴다 —
     --nav-w 가 0 이라 아무것도 안 바뀐다 -->
<nav class="sidenav" aria-label="주요 메뉴">

       사이트맵처럼 읽히고, 지금 어디인지도 글자 무게로만 말하게 된다.
       선 아이콘 하나로 통일하고 색은 currentColor 로 받아 선택 상태를 따라간다 -->
  <ul class="sidenav-list">
    <li><a href="#/" data-nav="">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.6 12 3.8l8.5 6.8V20a1 1 0 0 1-1 1h-4.6v-6H9.1v6H4.5a1 1 0 0 1-1-1z"/></svg>
      <span>내 발표</span></a></li>
    <li><a href="#/report" data-nav="report">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.2" width="16" height="17.6" rx="2.4"/><path d="M8.4 13.4v3.2M12 9.6v7M15.6 12.2v4.4"/></svg>
      <span>리포트</span></a></li>
    <!-- 개념 그래프 3D 무대. 여기 없으면 부스에서 아무도 못 찾는다 (주소로만 들어가야 하므로) -->
    <li><a href="#/graph" data-nav="graph">
      <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"/><circle cx="5.6" cy="17" r="2.4"/><circle cx="18.4" cy="17" r="2.4"/><path d="M10.4 7.6 7 14.8M13.6 7.6 17 14.8M8 17h8"/></svg>
      <span>개념 그래프</span></a></li>
  </ul>
  <!-- 병아리 넷은 app.js 가 채운다 (Chatter.chickSvg). 비어 있어도 링크는 그대로 동작한다 -->
  <a class="sidenav-foot" href="#/about" data-nav="about">
    <span class="sidenav-crew" aria-hidden="true"></span>

<!-- 아트보드 안에서 스크롤이 나는 자리. 데스크톱에서 body 는 1336×1024 판으로
     고정되므로, body 가 직접 스크롤하면 왼쪽 내비(position:fixed)가 판과 함께
     밀려 올라간다. 좁은 화면(<900px)에서는 display:contents 라 이 div 는
     레이아웃에서 아예 사라진다 — 기존 모바일 흐름이 그대로다 -->
<div class="artboard-scroll">

<header class="topbar">

<main id="app"></main>

<!-- 첫 화면에 안 쓰는 파일은 쓸 때 받는다 (js/lazy.js). 여기 적어 두면 브리지가 ?v= 를 내용 해시로 바꾸고
     scripts/chk bump 도 올려 준다 — <template> 안이라 브라우저는 받지도 실행하지도 않는다.
     beta    : 팀 코드로 여는 베타 화면(#/temp·#/vision·#/booth/qa)과 그 흐름이 켜진 채 새로 고친 #/new·#/qa
               app.js 의 LAZY_FLOW_FLAGS 가 이 파일들의 sessionStorage 키와 같아야 한다 (tests/js/lazy.smoke.mjs)
     landing : #/landing
     motion  : 분석 타임라인·피드의 스프링 등장 모션 — 첫 화면이 뜬 뒤 한가할 때. 없어도 화면은 그대로 뜬다
     pdf     : 올린 PDF 를 브라우저에서 여는 pdf.js — 한가할 때 받고, 쓰는 곳은 ccEnsurePdfjs() 로 기다린다 -->
<template id="lazyAssets">
  <link rel="stylesheet" href="css/call_flow.css?v=cf5" data-bundle="beta">
  <link rel="stylesheet" href="css/vision_rehearsal.css?v=vr5" data-bundle="beta">
  <link rel="stylesheet" href="css/booth_qa.css?v=bq9" data-bundle="beta">
  <link rel="stylesheet" href="css/booth_call.css?v=bc21" data-bundle="beta">
  <link rel="stylesheet" href="css/rehearsal.css?v=rh5" data-bundle="beta">
  <!-- 통화 배치 흐름 #/temp (발표: 자료 정면 + 내 모습 작은 창 · Q&A: 내 모습 가운데). app.js 의 전역을 호출 시점에 찾는다 -->

  <script src="js/vision_cue.js?v=vr4" data-bundle="beta"></script>
  <script src="js/vision_rehearsal.js?v=vr11" data-bundle="beta"></script>
  <!-- 부스 Q&A 무대 #/booth/qa — 카메라 판단(OpenCV.js 는 이 화면에서만 받는다) · 화면 흐름 -->
  <script src="js/booth_cv.js?v=bq3" data-bundle="beta"></script>
  <script src="js/booth_ops.js?v=bo9" data-bundle="beta"></script>
  <script src="js/booth_qa.js?v=bq11" data-bundle="beta"></script>
  <script src="js/booth_call.js?v=bc18" data-bundle="beta"></script>
  <!-- 리허설 한 줄 흐름 #/rehearsal — 고르기 → 비전 리허설 → 분석 기다림 → 글라스 화상판 → 리포트. 위 파일들의 전역을 호출 시점에 찾는다 -->
  <script src="js/rehearsal.js?v=rh11" data-bundle="beta"></script>
  <!-- 랜딩(#/landing) — v2 는 마크업+CSS 만 쓴다. landing-motion·landing-workbench 는
       스크롤 하이재킹·히어로 목업용이라 v2 에서 뺐다 (파일은 되돌릴 수 있게 남겨 둠) -->
