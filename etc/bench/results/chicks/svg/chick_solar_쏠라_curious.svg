<svg class="ch-chick" viewBox="-6 -6 112 112" role="img" aria-label="쏠라 병아리" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><style>svg{--chick-body:#FFD96A;--chick-midm:#FFD96A;--chick-solar:#FFD96A;
