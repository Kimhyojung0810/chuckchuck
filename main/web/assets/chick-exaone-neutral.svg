<svg xmlns="http://www.w3.org/2000/svg" class="px-chick" data-preset="cute" data-mood="neutral" viewBox="-10 -18 120 120" width="1024" height="1024" role="img" aria-label="엑사원 병아리"><style>svg.px-chick{--px-body:#FFD96A;--px-line:#356B59;--px-mint:#9ADBC0;--px-beak:#F0A93C;--px-blush:#F7B6A8;}/* ── 삐약이 (studio-app/src/piyak) — 객석 발표새와 같은 색. 몸 · 외곽선 · 얼굴 색은 캐릭터 고유색이라 무대 색이 바뀌어도 그대로 ── */


.px-chick svg { display: block; width: 100%; height: 100%; overflow: visible; }
.px-chick :is(g, path, ellipse, circle, rect, text) { transform-box: fill-box; }
.px-glow { pointer-events: none; }
.px-shadow { fill: rgba(0, 0, 0, .38); }
.px-breath { transform-origin: 50% 100%; animation: pxBreathe 3.6s ease-in-out infinite; }
/* 숨 · 흔들기 — 눈에 띄게 (10-13 사용자: 「훨씬 더 적극적으로」). 들숨에 늘고, 좌우로 몸을 흔든다 */
@keyframes pxBreathe {
  0%, 100% { transform: scale(1, 1) rotate(0deg); }
  25%      { transform: scale(1.01, 1.03) rotate(2.2deg); }
  50%      { transform: scale(1.02, 1.055) rotate(0deg); }
  75%      { transform: scale(1.01, 1.03) rotate(-2.2deg); }
}
/* cute(기본) — 흔들기 대신 말랑하게 숨 쉰다: 옆으로만 볼록 퍼졌다 돌아온다 (세로로 늘지 않는다 — 「길쭉하면 안 귀엽다」 10-13) */
.px-chick[data-preset="cute"] .px-breath { animation: pxBreatheCute 2.8s ease-in-out infinite; }
@keyframes pxBreatheCute {
  0%, 100% { transform: scale(1, 1); }
  40%      { transform: scale(1.032, .982); }
  70%      { transform: scale(1.012, .996); }
}
.px-chick[data-preset="cute"] :is(.px-leg-l, .px-leg-r) { transform-origin: 50% 0; animation: pxTap 1.4s ease-in-out infinite; }
.px-chick[data-preset="cute"] .px-leg-r { animation-delay: -.7s; }
@keyframes pxTap { 0%, 60%, 100% { transform: none; } 75% { transform: translateY(-1.6px) rotate(-8deg); } }
/* 커서가 올라오거나 기쁘면 볼이 발그레 */
.px-blush { transition: opacity .3s; }
.px-chick:is(:hover, [data-mood="happy"], [data-mood="excited"]) .px-blush { opacity: .95; }

.px-fill { fill: var(--px-body); stroke: var(--px-line); stroke-linejoin: round; }
.px-w24 { stroke-width: 2.4; }
.px-w3 { stroke-width: 2.6; }
.px-legs :is(path, ellipse) { fill: var(--px-beak); stroke: var(--px-line); stroke-width: 1.4; stroke-linejoin: round; }
.px-body { fill: var(--px-body); }
.px-outline { fill: none; stroke: var(--px-line); stroke-width: 2.6; stroke-linejoin: round; }
.px-tuft path { stroke: var(--px-line); }
.px-tuft .px-mint { fill: var(--px-mint); stroke-width: 1.6; stroke-linejoin: round; }
.px-blush { fill: var(--px-blush); opacity: .65; }
.px-beak { fill: var(--px-beak); stroke: var(--px-line); stroke-width: 1.3; }
.px-prop rect { stroke: var(--px-line); stroke-width: 2; }
.px-prop rect.px-mint { fill: var(--px-mint); stroke: none; }
.px-prop .px-cap { fill: var(--px-beak); }
.px-prop .px-tip { fill: #F7E9B8; stroke: var(--px-line); stroke-width: 1.5; stroke-linejoin: round; }
.px-rosette :is(.px-ribbon, .px-medal) { fill: var(--px-mint); stroke: var(--px-line); stroke-width: 1.6; stroke-linejoin: round; }
.px-rosette .px-star { fill: var(--px-body); stroke: var(--px-line); stroke-width: .7; }
.px-phones .px-band { fill: none; stroke: var(--px-line); stroke-width: 3.4; stroke-linecap: round; }
.px-phones rect.px-cup { fill: var(--px-mint); stroke: var(--px-line); stroke-width: 2; }

/* 눈 · 표정 — 평소엔 또렷한 눈동자, mood 가 표정 곡선 · 감정 표시를 켠다 (chatter.css 와 같은 규칙) */
.px-eye-ball { fill: #2F3B33; transform-origin: center; transition: transform .25s ease, opacity .18s; }
.px-eye-line { fill: none; stroke: #2F3B33; stroke-width: 2; stroke-linecap: round; opacity: 0; transition: opacity .18s; }
.px-emote > * { opacity: 0; transform-origin: center; transform: scale(.6); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
.px-heart { fill: #FF8FA3; }
.px-mark path { fill: none; stroke: var(--px-mint); stroke-width: 2.8; stroke-linecap: round; }
.px-mark circle { fill: var(--px-mint); }
.px-spark path { fill: #FFF2C4; stroke: var(--px-line); stroke-width: .9; }
.px-chick:is([data-mood="happy"], [data-mood="grumpy"]) .px-eye-ball { opacity: 0; }
.px-chick[data-mood="happy"] .px-eye-happy, .px-chick[data-mood="grumpy"] .px-eye-grumpy { opacity: 1; }
.px-chick[data-mood="happy"] .px-heart, .px-chick[data-mood="curious"] .px-mark, .px-chick[data-mood="excited"] .px-spark { opacity: 1; transform: none; }
.px-chick[data-mood="curious"] .px-eye-ball { transform: scale(1.08); }
.px-chick[data-mood="excited"] .px-eye-ball { transform: scale(1.18); }

.px-line { margin: 0; min-height: 1.65em; color: var(--ink-2); font-size: var(--fs-sm); text-wrap: balance; }
.px-mic { display: grid; justify-items: center; gap: var(--sp-1); }
.px-mic__note { font-size: var(--fs-label); color: var(--ink-3); }
.px-mic__note--error { color: var(--warn); max-width: 22em; }

