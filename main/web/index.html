<script>
  /* 1336×1024 내부 레이아웃은 유지하고, 실제 창에 들어가는 배율만 계산한다. */
  (() => {
    const syncArtboard = () => {
      const desktop = window.matchMedia('(min-width: 900px)').matches;
      const scale = desktop ? Math.min(innerWidth / 1336, innerHeight / 1024) : 1;
      document.documentElement.style.setProperty('--artboard-scale', String(scale));
    };
    syncArtboard();
    window.addEventListener('resize', syncArtboard, { passive: true });
  })();
  /* #/tour(부스 QR 체험)로 들어오면 앱 셸(「새 발표 연습」 탑바)을 그리지 않고 「체험을 준비하고 있어요…」 부터 — app.js · 투어 번들을
     받는 동안(느린 4G 에서 2.5초) 앱 머리만 보이다가 방문객이 「새 발표 연습」 을 눌러 카메라 흐름으로 빠졌다 (10-12 점검).
     투어 층이 뜨면(js/tour.js) · 투어 밖으로 가면(app.js route) 걷는다 */
  if (/^#\/?tour(?:[/?]|$)/.test(location.hash)) document.documentElement.classList.add('tour-boot');
  /* /hi 에서 막 넘어온 첫 기록에 표시(state.hi)를 남긴다 — 투어 「팀 소개로」 · 리허설 「나가기」 가 이 표시가 있는 사슬에서만 되돌아가 /hi 기록으로 간다.
     referrer 는 이 문서 내내 /hi 로 남아, 다른 기록(리허설 나가기가 쌓은 것)의 앞도 /hi 로 믿었다 (10-12 2차 flow-regression-inapp-r2-1).
     새로 고침 · 뒤로 온 기록은 건드리지 않는다. 같은 규칙: js/tour_logic.js hiEntryState (etc/tests/js/tour.smoke.mjs) */
  try {
    const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
    const m = String(document.referrer || '').match(/^(https?:\/\/[^/]+)(\/[^?#]*)/i);
    if (history.state == null && nav.type === 'navigate' && m && m[1] === location.origin && /^\/hi(?:\/[a-z0-9-]{1,24})?\/?$/i.test(m[2])) {
      history.replaceState({ hi: true, depth: 0 }, '');
    }
  } catch (_) { /* 기록 표시는 덤 — 없으면 「팀 소개로」 가 /hi 로 바꿔 간다 */ }
  /* 도메인 첫 화면은 리허설 올리기다 (10-12 사용자 「리허설이 main」). 빈 주소 · #/ 를 app.js 가 읽기 전에 #/rehearsal 로 바꿔
     앱 셸(내 발표)이 한 번 비쳤다 사라지지 않게 한다. 예전 홈(내 발표 목록)은 #/home. 앱 안에서 #/ 로 가는 링크는 route() 가 같은 규칙으로 돌린다 */
  if (/^(#\/?)?$/.test(location.hash)) history.replaceState(history.state, '', '#/rehearsal');
</script>
